# Alertmanager de ejemplo: email + webhook de chat (Slack/Discord/Teams) + heartbeat.
# PLANTILLA NO PROBADA con Alertmanager real (amtool no está disponible en este
# entorno; solo se ha validado que el YAML parsea). Antes de desplegar:
#   amtool check-config alertmanager.yml
# Requiere Alertmanager >= 0.28 (campos *_file para secretos y msteamsv2_configs).
#
# Alertmanager NO expande variables de entorno en este fichero: las direcciones van
# en claro (sustituye los ejemplos) y los secretos se leen de ficheros montados como
# secretos de Docker Compose / Kubernetes (/run/secrets/...):
#   smtp_password     -> contraseña SMTP (SMTP_PASSWORD)
#   alert_webhook_url -> URL del webhook de chat (ALERT_WEBHOOK_URL)
#   heartbeat_url     -> URL del heartbeat del servicio de uptime (Watchdog)

global:
  resolve_timeout: 5m
  smtp_smarthost: "smtp.example.com:587"
  smtp_from: "Alertas Repostería <alertas@reposteria.example.com>"
  smtp_auth_username: "alertas@reposteria.example.com"
  smtp_auth_password_file: /run/secrets/smtp_password
  smtp_require_tls: true

time_intervals:
  # Los avisos (warning) no despiertan a nadie: se entregan al acabar la noche.
  - name: noche
    time_intervals:
      - times:
          - start_time: "00:00"
            end_time: "07:30"
        location: Europe/Madrid

route:
  receiver: equipo-email
  group_by: [alertname, severity]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    # Dead man's switch: se reenvía cada minuto al heartbeat externo.
    - matchers:
        - alertname = "Watchdog"
      receiver: heartbeat
      group_wait: 0s
      group_interval: 1m
      repeat_interval: 1m

    - matchers:
        - severity = "critical"
      receiver: equipo-critico
      group_wait: 10s
      group_interval: 2m
      repeat_interval: 1h

    - matchers:
        - severity = "warning"
      receiver: equipo-email
      repeat_interval: 12h
      mute_time_intervals:
        - noche

inhibit_rules:
  # Misma alerta en critical y warning: solo la critical.
  - source_matchers:
      - severity = "critical"
    target_matchers:
      - severity = "warning"
    equal: [alertname]

  # Si toda la app está caída, sobran los síntomas derivados.
  - source_matchers:
      - alertname =~ "ReposteriaAllInstancesDown|ReposteriaSiteDownExternal"
    target_matchers:
      - alertname =~ "ReposteriaInstanceDown|ReposteriaCapacityDegraded|ReposteriaReadinessFailing|ReposteriaHighLatencyP95|ReposteriaRouteHighLatencyP95|ReposteriaHigh5xxRate|ReposteriaJobsStalled|ReposteriaJobsDelayed|ReposteriaJobsBacklog|ReposteriaErrorBudgetBurn|ReposteriaLoadShedding"

  # Si PostgreSQL está caído, la app no llega a la BD y la cola se para.
  - source_matchers:
      - alertname = "PostgresDown"
    target_matchers:
      - alertname =~ "ReposteriaDatabaseUnreachable|ReposteriaReadinessFailing|ReposteriaJobsStalled|ReposteriaJobsDelayed|ReposteriaJobsBacklog|PostgresConnectionsHigh|ReposteriaHigh5xxRate"

  # La cola parada ya engloba el atraso.
  - source_matchers:
      - alertname = "ReposteriaJobsStalled"
    target_matchers:
      - alertname =~ "ReposteriaJobsDelayed|ReposteriaJobsBacklog"

  # Si Redis está caído, la app lo ve caído (la readiness NO falla por Redis: solo depende de la BD).
  - source_matchers:
      - alertname = "RedisDown"
    target_matchers:
      - alertname =~ "ReposteriaRedisUnreachable|RedisMemoryHigh"

receivers:
  - name: equipo-email
    email_configs:
      - to: "alertas@reposteria.example.com"
        send_resolved: true
        headers:
          Subject: '[{{ .Status | toUpper }}] {{ .CommonLabels.alertname }} ({{ .CommonLabels.severity }})'

  - name: equipo-critico
    email_configs:
      - to: "alertas@reposteria.example.com"
        send_resolved: true
        headers:
          Subject: '[{{ .Status | toUpper }}] CRÍTICA: {{ .CommonLabels.alertname }}'
    # Slack (webhook entrante). Para Discord o Teams, sustituye este bloque por el
    # correspondiente de abajo (Alertmanager genera el JSON propio de cada servicio).
    slack_configs:
      - api_url_file: /run/secrets/alert_webhook_url
        send_resolved: true
        title: '{{ if eq .Status "firing" }}[ACTIVA]{{ else }}[RESUELTA]{{ end }} {{ .CommonLabels.alertname }} ({{ .CommonLabels.severity }})'
        text: >-
          {{ range .Alerts }}*{{ .Annotations.summary }}*
          {{ .Annotations.description }}
          {{ if .Annotations.runbook }}Runbook: {{ .Annotations.runbook }}{{ end }}
          {{ end }}
    # discord_configs:
    #   - webhook_url_file: /run/secrets/alert_webhook_url
    #     send_resolved: true
    #     title: '{{ .CommonLabels.alertname }} ({{ .CommonLabels.severity }})'
    #     message: '{{ range .Alerts }}{{ .Annotations.summary }}{{ "\n" }}{{ end }}'
    # msteamsv2_configs:            # Teams con flujos de Power Automate (Workflows)
    #   - webhook_url_file: /run/secrets/alert_webhook_url
    #     send_resolved: true
    #     title: '{{ .CommonLabels.alertname }} ({{ .CommonLabels.severity }})'
    #     text: '{{ range .Alerts }}{{ .Annotations.summary }}{{ "\n" }}{{ end }}'

  - name: heartbeat
    webhook_configs:
      - url_file: /run/secrets/heartbeat_url
        send_resolved: false
