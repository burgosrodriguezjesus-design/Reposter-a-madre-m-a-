# ════════════════════════════════════════════════════════════════════
#  TLS — perfil "intermediate" de Mozilla (TLS 1.2 + 1.3), nivel http
#  https://ssl-config.mozilla.org/#server=nginx&config=intermediate
# ════════════════════════════════════════════════════════════════════
ssl_protocols TLSv1.2 TLSv1.3;

# Solo ECDHE con AES-GCM o CHACHA20-POLY1305 (secreto perfecto hacia delante, AEAD).
# TLS 1.3 usa siempre sus propias suites AEAD; esta lista solo afecta a TLS 1.2.
ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
ssl_prefer_server_ciphers off;

# Curvas para el intercambio de claves. Con OpenSSL ≥ 3.5 (Alpine 3.22+) puedes anteponer
# el híbrido post-cuántico: X25519MLKEM768:X25519:prime256v1:secp384r1
ssl_ecdh_curve X25519:prime256v1:secp384r1;

# DHE es opcional. Solo si añades cifrados DHE-RSA-* a la lista anterior:
#   curl https://ssl-config.mozilla.org/ffdhe2048.txt > /etc/nginx/tls/dhparam.pem
# ssl_dhparam /etc/nginx/tls/dhparam.pem;

# Reanudación de sesión con caché compartida; sin tickets (evita reutilizar la clave de
# ticket durante días y romper el secreto perfecto hacia delante).
ssl_session_timeout 1d;
ssl_session_cache shared:TLS:10m;
ssl_session_tickets off;

# OCSP stapling. Necesita "resolver" (definido en nginx.conf) y la cadena intermedia en
# ssl_trusted_certificate (dentro del server). Ojo: Let's Encrypt eliminó OCSP en 2025; con sus
# certificados nginx solo avisa "no OCSP responder URL" y sigue funcionando. Con CAs que
# mantienen OCSP, el stapling ahorra a los navegadores una consulta a la CA.
ssl_stapling on;
ssl_stapling_verify on;

# Registros TLS pequeños al inicio: primer byte antes en móviles.
ssl_buffer_size 4k;
