# ════════════════════════════════════════════════════════════════════
#  Mapas (nivel http)
# ════════════════════════════════════════════════════════════════════

# ── Límite de /admin/login solo para POST (intentos de acceso vía Server Action) ──
# Clave vacía = la petición no cuenta en esa zona (las cargas GET de la página usan el límite general).
map $request_method $login_limit_key {
    POST    $binary_remote_addr;
    default "";
}

# ── /_next/image: formato de salida según Accept ──
# Next elige AVIF/WebP según la cabecera Accept y responde con "Vary: Accept". Para no guardar
# una variante por cada navegador, se normaliza Accept a tres valores y el formato entra en la
# clave de caché (y se ignora Vary en la caché).
map $http_accept $img_format {
    default        "orig";
    "~*image/avif" "avif";
    "~*image/webp" "webp";
}
map $img_format $img_accept {
    avif    "image/avif,image/webp,*/*";
    webp    "image/webp,*/*";
    default "*/*";
}

# ── Cabeceras de seguridad "de respaldo" ──
# La app (next.config.ts / proxy.ts) ya envía sus cabeceras. Estas solo se añaden si la respuesta
# NO trae la suya (respuestas generadas por nginx: redirecciones, 404 de rutas bloqueadas, 429,
# 502/503...). Un valor vacío hace que add_header no añada nada: así no hay duplicados.
map $upstream_http_strict_transport_security $fb_hsts {
    ""      "max-age=63072000; includeSubDomains";
    default "";
}
map $upstream_http_x_content_type_options $fb_nosniff {
    ""      "nosniff";
    default "";
}
map $upstream_http_x_frame_options $fb_frame {
    ""      "DENY";
    default "";
}
map $upstream_http_referrer_policy $fb_referrer {
    ""      "strict-origin-when-cross-origin";
    default "";
}
map $upstream_http_permissions_policy $fb_permissions {
    ""      "camera=(), microphone=(), geolocation=(), payment=(self)";
    default "";
}
map $upstream_http_cross_origin_opener_policy $fb_coop {
    ""      "same-origin";
    default "";
}
# Cache-Control inmutable para /_next/static/ si el origen no lo envía
map $upstream_http_cache_control $fb_static_cache_control {
    ""      "public, max-age=31536000, immutable";
    default "";
}

# ── Registro sin datos sensibles ──
# El Referer puede llevar tokens en la query (enlaces de baja, recuperación de carrito...):
# se registra solo esquema + host + ruta.
map $http_referer $referer_sin_query {
    "~^(?<ref_base>[^?#]*)" $ref_base;
    default                 "";
}
