# ════════════════════════════════════════════════════════════════════
#  Rutas que nunca deben llegar a la app (nivel server)
# ════════════════════════════════════════════════════════════════════
#  Son locations con expresión regular: nginx las evalúa antes que los prefijos normales
#  ("/", "/api/"...), pero NO dentro de prefijos "^~" (por eso /_next/static/ repite el bloqueo
#  de *.map). Se responde 404 (no 403) para no confirmar que existen.
# ════════════════════════════════════════════════════════════════════

# Ficheros y directorios ocultos: /.env, /.git/, /.DS_Store, /.npmrc... (salvo /.well-known/)
location ~ /\.(?!well-known/) {
    return 404;
}

# Mapas de código fuente
location ~* \.map$ {
    return 404;
}

# Copias, volcados, claves, configuración y ejecutables de otras plataformas
location ~* \.(?:php[0-9]?|phtml|phar|asp|aspx|ashx|jsp|jspx|cgi|pl|py|sh|bash|exe|dll|bak|backup|old|orig|save|swp|swo|tmp|sql|sqlite3?|db|dump|ini|cfg|conf|log|env|pem|key|crt|p12|pfx|age|ya?ml|toml|lock|tar|tgz|gz|bz2|xz|zst|zip|7z|rar)$ {
    return 404;
}

# Ruido de escáneres automáticos
location ~* ^/(?:wp-admin|wp-login|wp-content|wp-includes|xmlrpc|phpmyadmin|pma|cgi-bin|server-status|server-info|actuator|vendor/phpunit|_ignition|telescope|\.aws|owa|autodiscover)(?:/|$) {
    return 404;
}
