# ════════════════════════════════════════════════════════════════════
#  Limitación de tasa y conexiones (nivel http)
# ════════════════════════════════════════════════════════════════════
#  La clave es la IP real del cliente ($binary_remote_addr): este nginx es el borde, nadie
#  delante reescribe la IP. Si pones una CDN delante, configura real_ip (snippets/real-ip-cdn.conf)
#  o todos los clientes compartirán la IP de la CDN.
#  La app aplica además su propio límite adaptativo en Redis (defensa en profundidad).
#  Con 10 MB por zona caben ~160 000 IPs.
# ════════════════════════════════════════════════════════════════════

# General (páginas, RSC, prefetch): 20 r/s, ráfaga 40 en cada location
limit_req_zone $binary_remote_addr zone=req_general:10m rate=20r/s;
# API: 10 r/s
limit_req_zone $binary_remote_addr zone=req_api:10m    rate=10r/s;
# Intentos de acceso al panel (solo POST, ver $login_limit_key): 5 por minuto
limit_req_zone $login_limit_key    zone=req_login:10m  rate=5r/m;
# Creación de pedidos: 2 r/s
limit_req_zone $binary_remote_addr zone=req_orders:10m rate=2r/s;
# Optimizador de imágenes (CPU de sharp): una página de catálogo pide muchas a la vez
limit_req_zone $binary_remote_addr zone=req_images:10m rate=30r/s;
# Webhook de Stripe: sin límite estricto, solo un techo alto contra abusos
limit_req_zone $binary_remote_addr zone=req_webhook:1m rate=50r/s;

# Conexiones simultáneas por IP (en HTTP/2 cuenta cada stream activo)
limit_conn_zone $binary_remote_addr zone=conn_per_ip:10m;

limit_req_status 429;
limit_conn_status 429;
limit_req_log_level warn;
limit_conn_log_level warn;
