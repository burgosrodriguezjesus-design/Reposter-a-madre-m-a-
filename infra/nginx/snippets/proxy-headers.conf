# ════════════════════════════════════════════════════════════════════
#  Cabeceras hacia la app (incluir en cada location que hace proxy_pass)
# ════════════════════════════════════════════════════════════════════
#  OJO: en nginx, si una location define algún proxy_set_header, deja de heredar TODOS los del
#  nivel superior. Por eso este archivo se incluye entero en cada location (y /_next/image añade
#  su Accept normalizado después).
# ════════════════════════════════════════════════════════════════════
# (proxy_http_version, tiempos de espera y reintentos están a nivel http: http-proxy-defaults.conf)
proxy_set_header Connection "";            # conexiones persistentes con el upstream

# Host público: la app compara Origin con Host / X-Forwarded-Host (anti-CSRF de proxy.ts y de
# las Server Actions de Next). $host no incluye puerto.
proxy_set_header Host              $host;
proxy_set_header X-Forwarded-Host  $host;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Port  443;

# IP real del cliente. Este nginx es el borde: $remote_addr es la IP de la conexión TCP.
# X-Forwarded-For se SOBRESCRIBE (no se usa $proxy_add_x_forwarded_for) para que un cliente no
# pueda inyectar IPs falsas. La app (TRUST_PROXY=nginx) lee X-Real-IP.
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $remote_addr;
proxy_set_header Forwarded         "";

# Correlación de logs nginx ↔ app
proxy_set_header X-Request-Id      $request_id;

# Cabeceras internas de Next.js que nunca deben venir de Internet (p. ej. CVE-2025-29927,
# omisión del middleware con x-middleware-subrequest) y cabeceras de enrutado tipo IIS.
proxy_set_header X-Middleware-Subrequest "";
proxy_set_header X-Now-Route-Matches     "";
proxy_set_header X-Matched-Path          "";
proxy_set_header X-Invoke-Path           "";
proxy_set_header X-Invoke-Query          "";
proxy_set_header X-Invoke-Output         "";
proxy_set_header X-Invoke-Status         "";
proxy_set_header X-Original-URL          "";
proxy_set_header X-Rewrite-URL           "";
