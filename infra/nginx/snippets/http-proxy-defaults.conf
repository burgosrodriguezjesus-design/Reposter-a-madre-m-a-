# ════════════════════════════════════════════════════════════════════
#  Valores por defecto del proxy hacia la app (nivel http, heredados por todas las locations)
# ════════════════════════════════════════════════════════════════════
#  Están aquí y no en proxy-headers.conf porque una location puede sobrescribirlos (webhook,
#  estáticos) sin provocar el error "is duplicate" de nginx.
# ════════════════════════════════════════════════════════════════════
proxy_http_version 1.1;

# Tiempos de espera hacia la app
proxy_connect_timeout 5s;
proxy_send_timeout    30s;
proxy_read_timeout    60s;

# Si una réplica cae, reintenta en otra SOLO peticiones idempotentes (nginx nunca reintenta
# POST/PATCH salvo con "non_idempotent", que no se usa).
proxy_next_upstream error timeout http_502 http_503 http_504;
proxy_next_upstream_tries 2;
proxy_next_upstream_timeout 10s;

# Búferes para respuestas cacheables (en páginas dinámicas se desactiva el buffering: streaming)
proxy_buffer_size 16k;
proxy_buffers 16 16k;
proxy_busy_buffers_size 32k;

proxy_redirect off;
proxy_hide_header X-Powered-By;
