# ════════════════════════════════════════════════════════════════════
#  Cabeceras de seguridad de respaldo (server y locations con add_header propio)
# ════════════════════════════════════════════════════════════════════
#  Los valores salen de snippets/http-maps.conf: solo se añaden si la app no envió la cabecera
#  (add_header con valor vacío no añade nada). "always" las aplica también a 4xx/5xx de nginx.
#  OJO: una location con cualquier add_header deja de heredar los del server; por eso este
#  archivo se incluye también en esas locations.
#  La CSP la pone la app (con nonce); aquí no se fija para no duplicarla ni contradecirla.
# ════════════════════════════════════════════════════════════════════
add_header Strict-Transport-Security $fb_hsts        always;
add_header X-Content-Type-Options    $fb_nosniff     always;
add_header X-Frame-Options           $fb_frame       always;
add_header Referrer-Policy           $fb_referrer    always;
add_header Permissions-Policy        $fb_permissions always;
add_header Cross-Origin-Opener-Policy $fb_coop       always;
