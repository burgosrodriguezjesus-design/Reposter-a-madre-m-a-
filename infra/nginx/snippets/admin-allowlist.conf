# ════════════════════════════════════════════════════════════════════
#  Lista de IPs permitidas para el panel /admin (OPCIONAL, desactivada por defecto)
# ════════════════════════════════════════════════════════════════════
#  El panel ya exige contraseña Argon2id + MFA y sesiones revocables. Si el equipo accede siempre
#  desde IPs fijas (tienda, VPN, WireGuard), restringir por IP elimina casi todo el ruido de ataques.
#  Descomenta y adapta; las IPs no listadas recibirán 403.
#  Ojo: si el obrador usa datos móviles (IP cambiante), usa una VPN antes de activar esto.
# ════════════════════════════════════════════════════════════════════
# allow 203.0.113.10;        # IP fija de la tienda (ejemplo)
# allow 198.51.100.0/28;     # salida de la VPN (ejemplo)
# deny  all;
