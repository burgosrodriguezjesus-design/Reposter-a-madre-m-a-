# ════════════════════════════════════════════════════════════════════
#  Caché del proxy (nivel http)
# ════════════════════════════════════════════════════════════════════
#  Solo se activa en tres locations: /_next/static/, /_next/image y /demo/.
#  Nunca en /admin, /api, /pedido, /presupuesto ni en el resto de páginas (proxy_cache off a nivel
#  de server). Además nginx, por defecto, NO guarda respuestas con Cache-Control private/no-store/
#  no-cache ni con Set-Cookie: no se usa proxy_ignore_headers sobre esas cabeceras.
#  Los directorios cuelgan de /tmp porque es escribible también sin privilegios (nginx solo crea
#  el último nivel de la ruta). Están en la capa escribible del contenedor: si se pierden, la caché
#  simplemente se vuelve a llenar.
# ════════════════════════════════════════════════════════════════════

# Recursos con hash en el nombre (JS/CSS/fuentes de Next): inmutables
proxy_cache_path /tmp/nginx-cache-static levels=1:2 keys_zone=static_cache:10m
                 max_size=512m inactive=30d use_temp_path=off;

# Imágenes públicas: optimizadas por Next (/_next/image) y de demostración (/demo/)
proxy_cache_path /tmp/nginx-cache-public levels=1:2 keys_zone=public_cache:20m
                 max_size=2g inactive=7d use_temp_path=off;
