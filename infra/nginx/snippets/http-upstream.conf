# ════════════════════════════════════════════════════════════════════
#  Upstream de la app (nivel http)
# ════════════════════════════════════════════════════════════════════
#  "app" resuelve (DNS de Docker) a las IPs de las 3 réplicas. Con "resolve" (nginx ≥ 1.27.3,
#  requiere "zone" y "resolver") nginx re-resuelve cada 10 s, así que una réplica reiniciada con
#  otra IP vuelve a recibir tráfico sin recargar nginx.
#  least_conn reparte hacia la réplica con menos peticiones en curso (renderizados lentos,
#  optimización de imágenes).
# ════════════════════════════════════════════════════════════════════
upstream reposteria_app {
    zone reposteria_app 64k;
    least_conn;
    server app:3000 resolve max_fails=3 fail_timeout=10s;

    # Conexiones persistentes hacia Node. keepalive_timeout < KEEP_ALIVE_TIMEOUT de la app (65 s)
    # para que sea siempre nginx quien cierre (evita 502 por carrera al reutilizar un socket).
    keepalive 32;
    keepalive_requests 1000;
    keepalive_timeout 60s;
}
