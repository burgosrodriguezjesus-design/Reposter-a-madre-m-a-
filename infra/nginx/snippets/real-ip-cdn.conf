# ════════════════════════════════════════════════════════════════════
#  IP real detrás de una CDN (OPCIONAL, no se incluye por defecto)
# ════════════════════════════════════════════════════════════════════
#  Solo si pones una CDN/proxy (p. ej. Cloudflare) DELANTE de este nginx. Entonces $remote_addr
#  sería la IP de la CDN y los límites por IP afectarían a todos los clientes a la vez.
#  Incluye este archivo dentro del bloque http (nginx.conf) DESPUÉS de completar los rangos
#  oficiales y actualizados de tu CDN, y cierra el puerto 443 del servidor a cualquier otra IP
#  (cortafuegos), o un atacante podría saltarse la CDN y falsificar la cabecera.
#  Con la CDN, la app sigue recibiendo X-Real-IP = $remote_addr ya corregida por este módulo.
# ════════════════════════════════════════════════════════════════════
# set_real_ip_from 173.245.48.0/20;     # rango de ejemplo: usa la lista oficial vigente de tu CDN
# set_real_ip_from 2400:cb00::/32;
# real_ip_header CF-Connecting-IP;      # Cloudflare; otras CDN: X-Forwarded-For + real_ip_recursive on
# real_ip_recursive off;
