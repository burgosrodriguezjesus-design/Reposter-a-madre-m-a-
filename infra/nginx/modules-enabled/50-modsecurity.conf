# Carga del conector ModSecurity v3 para nginx (incluido en la imagen owasp/modsecurity-crs:*-nginx*).
# Se monta en /etc/nginx/modules-enabled/ SOLO en el servicio "waf". Con la imagen nginx oficial
# no montes este directorio (el módulo no existe allí).
load_module modules/ngx_http_modsecurity_module.so;
