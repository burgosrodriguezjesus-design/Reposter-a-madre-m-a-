# ════════════════════════════════════════════════════════════════════
#  nginx.conf principal — proxy inverso TLS + WAF delante de la app
# ════════════════════════════════════════════════════════════════════
#  Imagen objetivo: owasp/modsecurity-crs:4.x-nginx-alpine (nginx ≥ 1.27.3, usuario sin privilegios,
#  puertos 8080/8443). En docker-compose.prod.yml este archivo se monta como plantilla
#  /etc/nginx/templates/nginx.conf.template; el entrypoint de la imagen lo copia a /etc/nginx/nginx.conf
#  sustituyendo SOLO variables de entorno definidas (${VAR}); aquí no se usa ninguna a propósito.
#  Las variables de nginx ($host, $uri...) van en minúsculas y no colisionan con envsubst.
#
#  También sirve con la imagen oficial nginx (sin WAF): no montes modules-enabled/ y listo.
#
#  ¡No escribas aquí las palabras que reemplazan los scripts de la imagen CRS con sed
#  (los marcadores en mayúsculas de su plantilla original)! Este archivo no las usa.
# ════════════════════════════════════════════════════════════════════

# Módulos dinámicos (ModSecurity en la imagen CRS). Si el directorio no existe, no carga nada.
include /etc/nginx/modules-enabled/*.conf;

worker_processes auto;
worker_rlimit_nofile 65535;
# Ruta escribible por el usuario sin privilegios de la imagen (uid 101).
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 4096;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    charset utf-8;

    server_tokens off;
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;

    # Directorios temporales escribibles sin privilegios
    client_body_temp_path /tmp/nginx-client-body;
    proxy_temp_path       /tmp/nginx-proxy;
    fastcgi_temp_path     /tmp/nginx-fastcgi;
    uwsgi_temp_path       /tmp/nginx-uwsgi;
    scgi_temp_path        /tmp/nginx-scgi;

    # DNS interno de Docker (redes definidas por el usuario). Necesario para:
    #  - re-resolver "app" (3 réplicas, IPs que cambian al reiniciar) en el upstream;
    #  - OCSP stapling (resolver el respondedor OCSP de la CA).
    # Fuera de Docker, cámbialo por tu resolutor (p. ej. 127.0.0.53 o el de tu proveedor).
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;

    # ── Límites y tiempos de espera (protección frente a slowloris y cuerpos enormes) ──
    client_max_body_size 12m;         # = serverActions.bodySizeLimit de next.config.ts
    client_body_buffer_size 128k;
    client_header_buffer_size 4k;
    large_client_header_buffers 4 32k; # Next-Router-State-Tree y cookies pueden ser largos
    client_header_timeout 10s;
    client_body_timeout 30s;           # entre dos lecturas, no total (subidas desde móvil)
    send_timeout 30s;
    keepalive_timeout 30s;
    keepalive_requests 1000;
    reset_timedout_connection on;
    server_names_hash_bucket_size 128;

    # ── Compresión (no recomprime lo que Next ya envía comprimido) ──
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/x-component application/javascript
               application/json application/xml application/manifest+json
               application/rss+xml image/svg+xml;

    # ── Piezas de nivel http (orden importante: zonas y mapas antes de los server) ──
    include /etc/nginx/snippets/tls.conf;
    include /etc/nginx/snippets/http-maps.conf;
    include /etc/nginx/snippets/http-limits.conf;
    include /etc/nginx/snippets/http-cache.conf;
    include /etc/nginx/snippets/http-upstream.conf;
    include /etc/nginx/snippets/http-proxy-defaults.conf;

    # conf.d/: logging.conf y default.conf (este proyecto) y, en la imagen CRS,
    # modsecurity.conf ("modsecurity on" + reglas OWASP CRS).
    include /etc/nginx/conf.d/*.conf;
}
