# ════════════════════════════════════════════════════════════════════
#  OWASP CRS v4 — exclusiones DESPUÉS de las reglas (Repostería Madre Mía)
# ════════════════════════════════════════════════════════════════════
#  Montaje (imagen owasp/modsecurity-crs:4-nginx-alpine):
#    /etc/modsecurity.d/owasp-crs/rules/RESPONSE-999-EXCLUSION-RULES-AFTER-CRS.conf
#  (/etc/modsecurity.d/owasp-crs es un enlace a /opt/owasp-crs en la imagen).
#
#  Aquí van las exclusiones "en tiempo de configuración" (SecRuleRemoveById,
#  SecRuleUpdateTargetById/ByTag): deben cargarse DESPUÉS de las reglas que modifican.
#  Afectan a TODAS las peticiones; para exclusiones por ruta usa REQUEST-900 (ctl:...).
#  Reglas locales: IDs 10000-10999.
# ════════════════════════════════════════════════════════════════════


# ── 1. Cookies opacas de la app ─────────────────────────────────────
# La cookie de sesión del panel (__Host-rmm_admin) es un token aleatorio (base64url) que la app
# valida contra la base de datos. Su contenido puede contener secuencias como "--" o "_-" que
# alguna regla de inyección SQL interpreta como comentario. Se excluye SOLO esa cookie de las
# reglas de ataque (siguen activas las de protocolo: tamaño, caracteres nulos, etc.).
# Cualquier otra cookie (incluida cookie_consent) se sigue inspeccionando.
SecRuleUpdateTargetByTag "attack-sqli" "!REQUEST_COOKIES:__Host-rmm_admin"
SecRuleUpdateTargetByTag "attack-xss" "!REQUEST_COOKIES:__Host-rmm_admin"
SecRuleUpdateTargetByTag "attack-injection-generic" "!REQUEST_COOKIES:__Host-rmm_admin"


# ── 2. Plantillas (desactivadas) ────────────────────────────────────
# Si el registro de auditoría muestra un falso positivo GLOBAL y reproducible (misma regla,
# mismo argumento en muchas rutas), exclúyelo aquí de forma acotada. Ejemplos:
#
# Notas del pedido con texto libre que disparan una regla concreta en todas las páginas:
#   SecRuleUpdateTargetById 942200 "!ARGS:notes"
#
# Nunca uses "SecRuleRemoveById" sobre familias completas (941*, 942*) ni subas el umbral
# de anomalía de forma permanente para "arreglar" un falso positivo.
