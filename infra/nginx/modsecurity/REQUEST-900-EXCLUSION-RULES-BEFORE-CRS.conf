# ════════════════════════════════════════════════════════════════════
#  OWASP CRS v4 — exclusiones ANTES de las reglas (Repostería Madre Mía)
# ════════════════════════════════════════════════════════════════════
#  Montaje (imagen owasp/modsecurity-crs:4.x-nginx-alpine):
#    /etc/modsecurity.d/owasp-crs/rules/REQUEST-900-EXCLUSION-RULES-BEFORE-CRS.conf
#
#  Configuración global (variables de entorno del servicio "waf" en docker-compose.prod.yml):
#    BLOCKING_PARANOIA=1 DETECTION_PARANOIA=1   → nivel de paranoia 1 (pocos falsos positivos)
#    ANOMALY_INBOUND=5 ANOMALY_OUTBOUND=4        → una sola regla crítica (5 puntos) bloquea
#    ALLOWED_METHODS / ALLOWED_REQUEST_CONTENT_TYPE (sin XML/SOAP: la app no los acepta)
#
#  Afinado recomendado: las primeras 1-2 semanas puedes subir ANOMALY_INBOUND a 50 (solo registra
#  casi todo), revisar el log de auditoría (JSON en la salida del contenedor, buscar "messages") y
#  añadir aquí exclusiones CONCRETAS (por ruta y argumento), y después volver a 5.
#
#  Reglas locales: IDs 10000-10999 (el rango 1-99 999 está reservado para uso local).
#  Este fichero se carga antes que REQUEST-901-INITIALIZATION.conf: lo que se fije aquí en
#  TX:allowed_request_content_type tiene prioridad sobre el valor por defecto del CRS.
# ════════════════════════════════════════════════════════════════════


# ── 1. Tipos de contenido ───────────────────────────────────────────
# Red de seguridad: si no llega ALLOWED_REQUEST_CONTENT_TYPE por entorno, se fija aquí la lista
# que usa la app (formularios, multipart para subir fotos, JSON y los informes CSP del navegador).
SecRule &TX:allowed_request_content_type "@eq 0" \
    "id:10000,\
    phase:1,\
    pass,\
    nolog,\
    t:none,\
    ver:'reposteria/1.0',\
    setvar:'tx.allowed_request_content_type=|application/x-www-form-urlencoded| |multipart/form-data| |application/json| |application/csp-report| |application/reports+json|'"


# ── 2. Server Actions de Next.js ────────────────────────────────────
# El cliente de Next envía las Server Actions como POST a la propia página con la cabecera
# "Next-Action: <id hexadecimal de 42 caracteres>" y, si no hay ficheros, con el cuerpo
# serializado (JSON con marcadores "$K1", "$undefined"...) y Content-Type text/plain;charset=UTF-8.
# Con ficheros usa multipart/form-data (campos "1_$ACTION_ID_<id>", "1_email"...).
#
# 2a. Se permite text/plain SOLO en esas peticiones (en el resto sigue prohibido: regla 920420).
SecRule REQUEST_HEADERS:Next-Action "@rx ^[0-9a-f]{40,64}$" \
    "id:10010,\
    phase:1,\
    pass,\
    nolog,\
    t:none,\
    ver:'reposteria/1.0',\
    chain"
    SecRule REQUEST_METHOD "@streq POST" \
        "t:none,\
        setvar:'tx.allowed_request_content_type=%{tx.allowed_request_content_type} |text/plain|'"

# 2b. Y ese cuerpo text/plain se analiza como JSON: así las reglas del CRS inspeccionan los
# argumentos de la acción (si no, el cuerpo quedaría sin revisar). Un cuerpo que no sea JSON
# válido lo rechaza la regla 200002 (modsecurity.conf) con 400.
SecRule REQUEST_HEADERS:Next-Action "@rx ^[0-9a-f]{40,64}$" \
    "id:10011,\
    phase:1,\
    pass,\
    nolog,\
    t:none,\
    ver:'reposteria/1.0',\
    chain"
    SecRule REQUEST_HEADERS:Content-Type "@rx ^text/plain" \
        "t:none,t:lowercase,\
        ctl:requestBodyProcessor=JSON"

# 2c. Cabeceras de enrutado del App Router (RSC, prefetch, árbol del router codificado en URL).
# Contienen JSON URL-codificado generado por Next, no datos del usuario: se excluyen de las
# reglas de ataque, pero se siguen aplicando las de protocolo (tamaños, caracteres inválidos).
SecAction \
    "id:10012,\
    phase:1,\
    pass,\
    nolog,\
    t:none,\
    ver:'reposteria/1.0',\
    ctl:ruleRemoveTargetByTag=attack-sqli;REQUEST_HEADERS:Next-Router-State-Tree,\
    ctl:ruleRemoveTargetByTag=attack-xss;REQUEST_HEADERS:Next-Router-State-Tree,\
    ctl:ruleRemoveTargetByTag=attack-injection-generic;REQUEST_HEADERS:Next-Router-State-Tree,\
    ctl:ruleRemoveTargetByTag=attack-sqli;REQUEST_HEADERS:Next-Url,\
    ctl:ruleRemoveTargetByTag=attack-xss;REQUEST_HEADERS:Next-Url"


# ── 3. Webhook de Stripe ────────────────────────────────────────────
# Stripe firma cada evento (cabecera Stripe-Signature, HMAC-SHA256) y la app lo verifica con el
# cuerpo EXACTO. Los eventos contienen textos libres de clientes (nombres, direcciones,
# descripciones) que pueden parecer ataques y provocar falsos positivos que harían perder pagos.
# Para POST /api/stripe/webhook con firma, ModSecurity no lee el cuerpo (ni lo altera); las
# reglas sobre URI, cabeceras y protocolo siguen activas. nginx ya limita el método (solo POST)
# y el tamaño (2 MB). Sin cabecera de firma, la petición se analiza completa como cualquier otra.
SecRule REQUEST_FILENAME "@streq /api/stripe/webhook" \
    "id:10020,\
    phase:1,\
    pass,\
    nolog,\
    t:none,\
    ver:'reposteria/1.0',\
    chain"
    SecRule REQUEST_METHOD "@streq POST" \
        "t:none,\
        chain"
        SecRule REQUEST_HEADERS:Stripe-Signature "@rx ^t=[0-9]+,v1=[0-9a-f]{64}" \
            "t:none,\
            ctl:requestBodyAccess=Off"


# ── 4. Plantillas de exclusiones del panel (desactivadas) ───────────
# Si el registro de auditoría muestra falsos positivos al guardar textos largos en el panel
# (descripciones de productos con HTML, por ejemplo), excluye SOLO ese argumento y esa ruta.
# El panel exige sesión + MFA en la app; aun así, no desactives el WAF entero para /admin.
#
# SecRule REQUEST_FILENAME "@beginsWith /admin/productos" \
#     "id:10030,phase:1,pass,nolog,t:none,ver:'reposteria/1.0',\
#     ctl:ruleRemoveTargetByTag=attack-xss;ARGS:description,\
#     ctl:ruleRemoveTargetByTag=attack-xss;ARGS:1_description"
