# ════════════════════════════════════════════════════════════════════
#  Activación de ModSecurity en nginx (nivel http)
# ════════════════════════════════════════════════════════════════════
#  Sustituye a la plantilla conf.d/modsecurity.conf.template de la imagen CRS (misma activación)
#  y añade el identificador de transacción = $request_id, el mismo que va en el log de accesos,
#  en la cabecera X-Request-Id hacia la app y en la página de "Solicitud bloqueada". Así un
#  cliente bloqueado por error puede dar un código que se encuentra en el log de auditoría.
#  setup.conf (de la imagen) incluye modsecurity.conf, crs-setup.conf y las reglas CRS, entre
#  ellas nuestros REQUEST-900/RESPONSE-999 de exclusiones.
# ════════════════════════════════════════════════════════════════════
modsecurity on;
modsecurity_rules_file /etc/modsecurity.d/setup.conf;
modsecurity_transaction_id "$request_id";
