# ════════════════════════════════════════════════════════════════════
#  Registro de accesos en JSON, minimizando datos personales (RGPD)
# ════════════════════════════════════════════════════════════════════
#  En la imagen CRS se monta como /etc/nginx/templates/conf.d/logging.conf.template y sustituye a
#  la plantilla de la imagen (que registra la URL completa con la query).
#  - "path" es $uri (ruta sin query): las queries pueden llevar tokens de baja, de recuperación de
#    carrito o emails de seguimiento.
#  - El Referer se registra sin query ($referer_sin_query, ver http-maps.conf).
#  - No se registran cookies ni Authorization.
#  - La IP se conserva por interés legítimo (seguridad, límites, investigación de abusos). Limita la
#    retención en el destino de logs (Docker: rotación max-size/max-file; en el agregador, p. ej. 30-90
#    días) y documenta el tratamiento en el registro de actividades.
# ════════════════════════════════════════════════════════════════════
log_format json_seguro escape=json
    '{"ts":"$time_iso8601","ip":"$remote_addr","method":"$request_method",'
    '"host":"$host","path":"$uri","status":$status,"bytes":$body_bytes_sent,'
    '"rt":$request_time,"urt":"$upstream_response_time","upstream":"$upstream_addr",'
    '"cache":"$upstream_cache_status","ref":"$referer_sin_query","ua":"$http_user_agent",'
    '"proto":"$server_protocol","tls":"$ssl_protocol","req_id":"$request_id"}';

access_log /dev/stdout json_seguro;
