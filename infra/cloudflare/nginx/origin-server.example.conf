# Ejemplo de bloque server del origen detrás de Cloudflare (contexto http).
# Requiere en el contexto http:
#   include /etc/nginx/snippets/cloudflare-ips.conf;   # realip + $from_cloudflare
#   upstream reposteria_app { server app:3000; ... }    # réplicas de la app
# PLANTILLA: validada con "nginx -t" en un entorno de prueba, no en producción.

server {
    # nginx >= 1.25.1: "listen 443 ssl;" + "http2 on;"
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name reposteria.example.com www.reposteria.example.com;

    # Certificado del origen: Cloudflare Origin CA (válido solo detrás de Cloudflare)
    # o Let's Encrypt. Necesario para el modo SSL "Full (strict)".
    ssl_certificate     /etc/nginx/certs/origin.pem;
    ssl_certificate_key /etc/nginx/certs/origin.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    # mTLS: solo Cloudflare puede conectarse
    include /etc/nginx/snippets/authenticated-origin-pulls.conf;

    # Defensa adicional al cortafuegos del host: cerrar conexiones que no vienen de Cloudflare
    if ($from_cloudflare = 0) {
        return 444;
    }

    # Mismo límite que serverActions.bodySizeLimit (12 MB)
    client_max_body_size 12m;
    proxy_buffer_size 16k;
    proxy_buffers 8 16k;

    # Rutas internas: nunca a través del proxy público (también se bloquean en Cloudflare)
    location ~ ^/api/(metrics|cron)(/|$) {
        return 404;
    }

    location / {
        proxy_pass http://reposteria_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        # $remote_addr ya es la IP del visitante (módulo realip). Se SOBRESCRIBEN las
        # cabeceras que pudiera enviar el cliente para que no pueda falsear su IP.
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }
}

# Peticiones por IP directa o con un Host desconocido: cerrar sin respuesta.
server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;
    ssl_certificate     /etc/nginx/certs/origin.pem;
    ssl_certificate_key /etc/nginx/certs/origin.key;
    ssl_reject_handshake on;
}
