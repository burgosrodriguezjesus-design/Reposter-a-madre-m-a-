# Authenticated Origin Pulls (mTLS Cloudflare -> origen). Contexto server.
# El origen solo acepta conexiones TLS que presenten el certificado de cliente de
# Cloudflare. Activar DESPUÉS de "tls_client_auth: on" en la zona (zone-settings.json),
# o el sitio dejará de responder.
#
# - AOP de zona: usa la CA pública de Cloudflare (descárgala de la documentación
#   "Authenticated Origin Pulls" y comprueba su fecha de caducidad).
#   Ese certificado lo comparten todas las zonas de Cloudflare: prueba que la
#   petición viene de Cloudflare, no de TU zona.
# - AOP por hostname (recomendado): sube tu propio certificado de cliente a Cloudflare
#   y pon aquí la CA que lo firmó. Así solo tu zona puede conectarse al origen.
ssl_client_certificate /etc/nginx/certs/cloudflare-origin-pull-ca.pem;
ssl_verify_client on;
ssl_verify_depth 2;
