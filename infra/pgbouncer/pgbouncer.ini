;; ════════════════════════════════════════════════════════════════════
;;  PgBouncer — pool de conexiones entre la app (3 réplicas) y PostgreSQL
;; ════════════════════════════════════════════════════════════════════
;;  Montaje: /etc/pgbouncer/pgbouncer.ini (solo lectura). La lista de usuarios (auth_file) la
;;  genera entrypoint.sh al arrancar, en un tmpfs, a partir del secreto postgres_app_password.
;;
;;  Modo transacción: cada transacción toma una conexión de servidor y la devuelve al terminar.
;;  Compatible con la app porque:
;;   - Prisma usa "?pgbouncer=true" (sin sentencias preparadas con nombre persistentes);
;;   - checkout.ts usa pg_advisory_xact_lock (bloqueo de TRANSACCIÓN, no de sesión);
;;   - statement_timeout/lock_timeout se fijan por rol (ALTER ROLE), no con SET de sesión.
;;  NO uses en la app: SET de sesión, LISTEN/NOTIFY, bloqueos asesores de sesión, cursores WITH HOLD.
;;
;;  Cuentas: 3 réplicas × connection_limit=10 = 30 clientes como máximo (más margen para
;;  despliegues graduales con 6 réplicas) → 40 conexiones de servidor como techo absoluto.
;; ════════════════════════════════════════════════════════════════════

[databases]
; Solo existe la base de datos de la app. Cualquier otro nombre se rechaza.
reposteria = host=postgres port=5432 dbname=reposteria

[users]
; Límite por usuario dentro de los pools (además del CONNECTION LIMIT del rol en PostgreSQL)
reposteria_app = max_user_connections=40

[pgbouncer]
;; ── Escucha ──
listen_addr = 0.0.0.0
listen_port = 6432
; Sin socket Unix: el contenedor solo atiende por la red interna "data"
unix_socket_dir =

;; ── Autenticación (clientes → PgBouncer) ──
auth_type = scram-sha-256
auth_file = /run/pgbouncer/userlist.txt
; Ni consola de administración ni estadísticas expuestas a nadie
admin_users =
stats_users =

;; ── Pooling ──
pool_mode = transaction
max_client_conn = 500
default_pool_size = 20
min_pool_size = 2
reserve_pool_size = 5
reserve_pool_timeout = 3
max_db_connections = 40
; Sentencias preparadas a nivel de protocolo en modo transacción (PgBouncer ≥ 1.21).
; Inofensivo con Prisma (pgbouncer=true) y útil para otros clientes.
max_prepared_statements = 200

;; ── Tiempos de espera ──
; Un cliente espera como mucho 15 s a que haya una conexión libre: mejor un error rápido (503 en
; /api/health/ready) que una cola infinita bajo carga.
query_wait_timeout = 15
; Transacción abierta y ociosa más de 60 s → se corta (protege filas bloqueadas)
idle_transaction_timeout = 60
client_login_timeout = 30
server_connect_timeout = 5
server_login_retry = 3
server_idle_timeout = 300
server_lifetime = 3600
server_check_delay = 30
server_check_query = select 1
; En modo transacción no se usa reset; si alguien hace SET de sesión, DISCARD ALL lo limpia al
; devolver la conexión solo si se activa server_reset_query_always (no recomendado: coste extra).
server_reset_query = DISCARD ALL

; Parámetros de arranque que envían algunos clientes y PgBouncer no puede propagar en modo
; transacción: se ignoran en vez de rechazar la conexión.
ignore_startup_parameters = extra_float_digits

;; ── TLS hacia PostgreSQL (obligatorio) ──
server_tls_sslmode = require
server_tls_protocols = secure
; Para verificar además la identidad del servidor con la CA interna de gen-secrets.sh:
;   server_tls_sslmode = verify-full
;   server_tls_ca_file = /run/secrets/internal_ca_cert
; (y monta el secreto internal_ca_cert en el servicio pgbouncer)

;; ── TLS desde la app (opcional) ──
; La red "data" es interna; aun así, si la app pide TLS (sslmode=prefer/require en DATABASE_URL),
; se cifra con el certificado interno de "pgbouncer".
client_tls_sslmode = prefer
client_tls_protocols = secure
client_tls_cert_file = /run/secrets/pgbouncer_tls_cert
client_tls_key_file = /run/secrets/pgbouncer_tls_key

;; ── DNS ──
; "postgres" se resuelve con el DNS de Docker; si el contenedor cambia de IP, se re-resuelve.
dns_max_ttl = 15

;; ── Registro (stdout del contenedor) ──
logfile =
syslog = 0
log_connections = 0
log_disconnections = 0
log_pooler_errors = 1
log_stats = 1
stats_period = 60
; No incluir la IP del cliente en application_name
application_name_add_host = 0
verbose = 0
