# ════════════════════════════════════════════════════════════════════
#  pg_hba.conf — quién puede conectarse, desde dónde y cómo
# ════════════════════════════════════════════════════════════════════
#  Montaje: /etc/postgresql/pg_hba.conf (hba_file en el comando del servicio "postgres").
#  Se evalúa de arriba abajo: la PRIMERA línea que coincide decide (aceptar o rechazar).
#
#  Red: "data" (172.30.20.0/24, internal: true) definida en docker-compose.prod.yml.
#   - PgBouncer tiene IP fija 172.30.20.10: es el ÚNICO origen permitido para el rol de la app.
#   - Migraciones, copias y monitorización entran por la misma red, siempre con TLS (hostssl)
#     y SCRAM-SHA-256. Cualquier conexión sin TLS o desde otra red se rechaza.
#
#  Si cambias los nombres de roles (variables PG_*_ROLE del servicio "postgres"), cámbialos
#  también aquí, en pgbouncer.ini y en prisma/sql/least-privilege.sql.
# ════════════════════════════════════════════════════════════════════

# TYPE    DATABASE          USER                 ADDRESS             METHOD

# Socket local dentro del contenedor: solo el superusuario "postgres" mapeado al usuario del
# sistema "postgres" (peer). Lo usan el entrypoint (initdb) y el mantenimiento con docker exec.
local     all               postgres                                 peer
local     all               all                                      reject

# App en ejecución: SOLO a través de PgBouncer, SOLO a su base de datos
hostssl   reposteria        reposteria_app       172.30.20.10/32     scram-sha-256

# Migraciones (servicio "migrate", rol propietario del esquema)
hostssl   reposteria        reposteria_owner     172.30.20.0/24      scram-sha-256

# Copias de seguridad: pg_dump (base de datos) y pg_basebackup (protocolo de replicación)
hostssl   reposteria        reposteria_backup    172.30.20.0/24      scram-sha-256
hostssl   replication       reposteria_backup    172.30.20.0/24      scram-sha-256

# Monitorización (postgres_exporter con rol "monitoring" + pg_monitor, solo estadísticas)
hostssl   reposteria,postgres monitoring         172.30.20.0/24      scram-sha-256

# Todo lo demás: rechazado (incluido el superusuario por red y cualquier conexión sin TLS)
host      all               all                  0.0.0.0/0           reject
host      all               all                  ::/0                reject
host      replication       all                  0.0.0.0/0           reject
host      replication       all                  ::/0                reject
