# ════════════════════════════════════════════════════════════════════
#  PostgreSQL 16 — configuración endurecida (despliegue autoalojado)
# ════════════════════════════════════════════════════════════════════
#  Montaje: /etc/postgresql/postgresql.conf (solo lectura) y arranque con
#    postgres -c config_file=/etc/postgresql/postgresql.conf -c hba_file=/etc/postgresql/pg_hba.conf
#  (ver servicio "postgres" en docker-compose.prod.yml).
#
#  Dimensionado de ejemplo para un servidor con 4 GB de RAM dedicados a PostgreSQL.
#  Ajusta shared_buffers (~25 % RAM) y effective_cache_size (~50-75 % RAM) a tu máquina.
#
#  Lo que NO está aquí a propósito:
#   - statement_timeout / lock_timeout por rol: se fijan con ALTER ROLE en
#     prisma/sql/least-privilege.sql (la app, el propietario y las copias tienen límites distintos).
#   - Contraseñas: nunca en este archivo (secretos de Docker, ver infra/postgres/initdb/).
# ════════════════════════════════════════════════════════════════════

# ── Conexiones ──────────────────────────────────────────────────────
listen_addresses = '*'                 # solo hay red interna "data" (internal: true); sin puertos publicados
port = 5432
# La app entra por PgBouncer (≤ 40 conexiones de servidor). El resto: migraciones, copias,
# monitorización y 3 reservadas a superusuario para emergencias.
max_connections = 100
superuser_reserved_connections = 3
unix_socket_directories = '/var/run/postgresql'
unix_socket_permissions = 0770

# Detecta clientes caídos (contenedor reiniciado) sin esperar al keepalive del sistema (2 h)
tcp_keepalives_idle = 60
tcp_keepalives_interval = 10
tcp_keepalives_count = 6
client_connection_check_interval = 10s

# ── Autenticación ───────────────────────────────────────────────────
password_encryption = scram-sha-256    # nunca md5
authentication_timeout = 10s

# ── TLS ─────────────────────────────────────────────────────────────
# El certificado y la clave llegan como secretos de Docker; entrypoint.sh los copia a un tmpfs
# con propietario postgres y permisos 0600 (PostgreSQL rechaza claves legibles por otros).
ssl = on
ssl_cert_file = '/var/lib/postgresql/tls/server.crt'
ssl_key_file = '/var/lib/postgresql/tls/server.key'
ssl_min_protocol_version = 'TLSv1.2'
# Solo AEAD con ECDHE en TLS 1.2 (TLS 1.3 usa siempre sus suites seguras)
ssl_ciphers = 'ECDHE+AESGCM:ECDHE+CHACHA20:!aNULL:!MD5:!SHA1'
ssl_prefer_server_ciphers = on
ssl_ecdh_curve = 'prime256v1'

# ── Memoria (ejemplo para 4 GB) ─────────────────────────────────────
shared_buffers = 1GB
effective_cache_size = 3GB
work_mem = 8MB                         # por operación de ordenación/hash y conexión: mantenlo bajo
maintenance_work_mem = 256MB
huge_pages = try

# ── Escritura anticipada (WAL), archivado y recuperación a un punto en el tiempo ──
wal_level = replica                    # necesario para archivado WAL y pg_basebackup
wal_compression = on                   # pglz (siempre disponible); lz4/zstd si tu imagen los incluye
max_wal_size = 2GB
min_wal_size = 256MB
checkpoint_timeout = 10min
checkpoint_completion_target = 0.9
max_wal_senders = 3                    # pg_basebackup (servicio "backup") y una réplica futura
wal_keep_size = 512MB

# Archivado continuo de WAL (RPO ≤ 15 min junto con las copias base diarias).
# Cada segmento cerrado se comprime en el volumen "pg-wal-archive" (/var/lib/postgresql/wal-archive);
# el servicio "backup" lo cifra con age, lo mueve a /backups/wal/ y borra el original sin cifrar.
# archive_timeout fuerza un cambio de segmento cada 5 min aunque haya poca actividad: es el
# máximo de datos que se perderían si se pierde el disco de la BD (RPO).
# OJO: si el archivado falla de forma continuada, el WAL se acumula en pg_wal hasta llenar el
# disco. Vigila pg_stat_archiver.failed_count (alerta en infra/monitoring).
archive_mode = on
archive_command = 'test ! -f /var/lib/postgresql/wal-archive/%f.gz && gzip -c %p > /var/lib/postgresql/wal-archive/%f.gz.tmp && mv /var/lib/postgresql/wal-archive/%f.gz.tmp /var/lib/postgresql/wal-archive/%f.gz'
archive_timeout = 300
# Para restaurar (ver infra/postgres/README.md), en el servidor de recuperación:
#   restore_command = 'age -d -i /ruta/clave-age.txt /backups/wal/%f.gz.age | gunzip > %p'

# ── Registro (salida estándar del contenedor; Docker rota los logs) ──
logging_collector = off
log_destination = 'stderr'
log_line_prefix = '%m [%p] %q%u@%d %h app=%a '
log_timezone = 'UTC'
log_connections = on
log_disconnections = on
log_min_duration_statement = 500ms     # consultas lentas (sin valores de parámetros, ver abajo)
log_lock_waits = on
deadlock_timeout = 1s
log_temp_files = 10MB
log_checkpoints = on
log_autovacuum_min_duration = 5s
log_statement = 'ddl'                  # cambios de esquema (auditoría); ¡ver aviso de contraseñas!
# RGPD: no registrar los VALORES de los parámetros de las consultas (emails, teléfonos,
# direcciones... aunque vayan cifrados por la app, los índices ciegos y textos libres no deben
# acabar en los logs).
log_parameter_max_length = 0
log_parameter_max_length_on_error = 0
log_min_error_statement = error
# AVISO: con log_statement = 'ddl', "ALTER ROLE ... PASSWORD 'xxx'" quedaría en el log en claro.
# Cambia contraseñas con "\password <rol>" de psql (envía el hash SCRAM, no la contraseña) o
# ejecuta antes "SET log_statement = 'none';" en esa sesión (lo hace initdb/10-roles.sh).

# ── Límites de sesión globales (los específicos por rol van en least-privilege.sql) ──
idle_in_transaction_session_timeout = 60s   # una transacción olvidada no bloquea filas indefinidamente
idle_session_timeout = 0                    # PgBouncer gestiona la inactividad de sus conexiones
statement_timeout = 0
lock_timeout = 0

# ── Estadísticas y monitorización ───────────────────────────────────
shared_preload_libraries = 'pg_stat_statements'
pg_stat_statements.track = top
pg_stat_statements.max = 5000
track_io_timing = on
track_functions = pl
compute_query_id = on

# ── Autovacuum (tablas de colas y sesiones con muchas actualizaciones) ──
autovacuum = on
autovacuum_max_workers = 3
autovacuum_naptime = 30s
autovacuum_vacuum_scale_factor = 0.05
autovacuum_analyze_scale_factor = 0.05

# ── Varios ──────────────────────────────────────────────────────────
timezone = 'UTC'
datestyle = 'iso, dmy'
default_text_search_config = 'pg_catalog.spanish'
# Impide que un rol sin privilegios cree objetos en el esquema public de otras BD
# (en PG ≥ 15 ya es el comportamiento por defecto; se deja explícito en initdb/10-roles.sh).
