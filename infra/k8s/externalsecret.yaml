# Secretos mediante External Secrets Operator (ESO): los valores viven en un gestor
# de secretos externo (AWS Secrets Manager, GCP Secret Manager, Vault, 1Password...)
# y ESO crea/actualiza los Secret de Kubernetes. En el repositorio no hay ningún
# secreto en claro.
#
# Requisitos: ESO >= 0.16 (API external-secrets.io/v1; versiones anteriores usan
# v1beta1) y un ClusterSecretStore llamado "reposteria-store" (ejemplo en
# optional/clustersecretstore-aws.example.yaml).
#
# Cada consumidor recibe solo lo que necesita (mínimo privilegio):
#   - la app: todo lo de su contrato de entorno;
#   - los CronJobs de cron: solo la cabecera Authorization con CRON_SECRET;
#   - la copia de seguridad: solo la URL directa de un rol de backup y la clave pública age;
#   - Prometheus (ServiceMonitor opcional): solo METRICS_TOKEN.
#
# PLANTILLA NO PROBADA EN UN CLÚSTER.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: reposteria-app-secrets
  labels:
    app.kubernetes.io/name: reposteria
    app.kubernetes.io/component: web
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: reposteria-store
  target:
    name: reposteria-app-secrets
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    # Vía PgBouncer: ...?pgbouncer=true&connection_limit=10
    - secretKey: DATABASE_URL
      remoteRef: { key: reposteria/production/app, property: DATABASE_URL }
    # DIRECT_URL (rol propietario, con DDL) NO llega a los pods: las migraciones se ejecutan en
    # CI/CD (deploy.yml). La app funciona sin ella (comprobado con Prisma 6).
    # Claves de cifrado de datos personales: rotar con "npm run keys:rotate"
    - secretKey: DATA_ENCRYPTION_KEYS
      remoteRef: { key: reposteria/production/app, property: DATA_ENCRYPTION_KEYS }
    - secretKey: DATA_ENCRYPTION_ACTIVE_KEY
      remoteRef: { key: reposteria/production/app, property: DATA_ENCRYPTION_ACTIVE_KEY }
    - secretKey: DATA_HASH_KEY
      remoteRef: { key: reposteria/production/app, property: DATA_HASH_KEY }
    - secretKey: REDIS_URL
      remoteRef: { key: reposteria/production/app, property: REDIS_URL }
    - secretKey: STRIPE_SECRET_KEY
      remoteRef: { key: reposteria/production/app, property: STRIPE_SECRET_KEY }
    - secretKey: STRIPE_WEBHOOK_SECRET
      remoteRef: { key: reposteria/production/app, property: STRIPE_WEBHOOK_SECRET }
    - secretKey: SMTP_USER
      remoteRef: { key: reposteria/production/app, property: SMTP_USER }
    - secretKey: SMTP_PASSWORD
      remoteRef: { key: reposteria/production/app, property: SMTP_PASSWORD }
    - secretKey: SUPABASE_SERVICE_ROLE_KEY
      remoteRef: { key: reposteria/production/app, property: SUPABASE_SERVICE_ROLE_KEY }
    - secretKey: METRICS_TOKEN
      remoteRef: { key: reposteria/production/app, property: METRICS_TOKEN }
    - secretKey: CRON_SECRET
      remoteRef: { key: reposteria/production/app, property: CRON_SECRET }
    - secretKey: WHATSAPP_TOKEN
      remoteRef: { key: reposteria/production/app, property: WHATSAPP_TOKEN }
    - secretKey: ALERT_WEBHOOK_URL
      remoteRef: { key: reposteria/production/app, property: ALERT_WEBHOOK_URL }
---
# Cabecera HTTP lista para curl ("-H @fichero"): el token no aparece en la línea
# de comandos ni en variables de entorno del pod de cron.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: reposteria-cron-auth
  labels:
    app.kubernetes.io/name: reposteria
    app.kubernetes.io/component: cron
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: reposteria-store
  target:
    name: reposteria-cron-auth
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        authorization-header: "Authorization: Bearer {{ .cronSecret }}"
  data:
    - secretKey: cronSecret
      remoteRef: { key: reposteria/production/app, property: CRON_SECRET }
---
# Token para que Prometheus (ServiceMonitor opcional) lea /api/metrics.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: reposteria-metrics-token
  labels:
    app.kubernetes.io/name: reposteria
    app.kubernetes.io/component: monitoring
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: reposteria-store
  target:
    name: reposteria-metrics-token
    creationPolicy: Owner
  data:
    - secretKey: token
      remoteRef: { key: reposteria/production/app, property: METRICS_TOKEN }
---
# Copia de seguridad: URL DIRECTA (pg_dump no funciona a través de PgBouncer en modo
# transacción) de un rol de solo lectura dedicado a backups, y la clave PÚBLICA age.
# La clave privada age NUNCA debe estar en el clúster: solo se usa al restaurar.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: reposteria-backup-secrets
  labels:
    app.kubernetes.io/name: reposteria
    app.kubernetes.io/component: backup
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: reposteria-store
  target:
    name: reposteria-backup-secrets
    creationPolicy: Owner
  data:
    - secretKey: DATABASE_URL
      remoteRef: { key: reposteria/production/backup, property: BACKUP_DATABASE_URL }
    - secretKey: BACKUP_AGE_RECIPIENT
      remoteRef: { key: reposteria/production/backup, property: BACKUP_AGE_RECIPIENT }
---
# Configuración de rclone para copiar las copias cifradas fuera del clúster
# (bucket S3/R2/B2 con bloqueo de objetos/versionado). Credenciales con permiso
# solo de escritura (sin borrar) sobre ese bucket.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: reposteria-backup-offsite
  labels:
    app.kubernetes.io/name: reposteria
    app.kubernetes.io/component: backup
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: reposteria-store
  target:
    name: reposteria-backup-offsite
    creationPolicy: Owner
  data:
    - secretKey: rclone.conf
      remoteRef: { key: reposteria/production/backup, property: RCLONE_CONF }
