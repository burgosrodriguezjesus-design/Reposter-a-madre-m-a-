# Cuentas de servicio sin token montado: la app y los CronJobs no hablan con la API
# de Kubernetes, así que no necesitan credenciales del clúster.
# PLANTILLA NO PROBADA EN UN CLÚSTER.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: reposteria-app
  labels:
    app.kubernetes.io/name: reposteria
    app.kubernetes.io/component: web
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: reposteria-cron
  labels:
    app.kubernetes.io/name: reposteria
    app.kubernetes.io/component: cron
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: reposteria-backup
  labels:
    app.kubernetes.io/name: reposteria
    app.kubernetes.io/component: backup
automountServiceAccountToken: false
