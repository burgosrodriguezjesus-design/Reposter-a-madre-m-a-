# EJEMPLO (no incluido en kustomization.yaml): almacén de secretos de ESO apuntando a
# AWS Secrets Manager con IRSA (rol IAM asociado a la ServiceAccount del operador).
# El rol solo debe poder leer los secretos "reposteria/production/*".
# Para GCP Secret Manager, Azure Key Vault, Vault o 1Password cambia el bloque
# "provider" (ver documentación de External Secrets Operator).
# PLANTILLA NO PROBADA EN UN CLÚSTER.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: reposteria-store
spec:
  # Solo el namespace de la app puede usar este almacén.
  conditions:
    - namespaces:
        - reposteria
  provider:
    aws:
      service: SecretsManager
      region: eu-west-3
      auth:
        jwt:
          serviceAccountRef:
            name: external-secrets
            namespace: external-secrets
