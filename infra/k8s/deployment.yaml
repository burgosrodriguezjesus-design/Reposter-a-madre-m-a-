# Deployment de la app (Next.js standalone: node server.js en el puerto 3000).
# PLANTILLA NO PROBADA EN UN CLÚSTER.
#
# Decisiones:
#  - 3 réplicas mínimo (el HPA escala de 3 a 20); RollingUpdate sin indisponibilidad.
#  - Sistema de ficheros raíz de solo lectura: solo /tmp y /app/.next/cache son
#    escribibles (emptyDir con límite de tamaño).
#  - Liveness en /api/health (no toca la BD: un fallo de la BD no debe reiniciar pods).
#  - Readiness en /api/health/ready (BD + Redis): un pod sin dependencias sale del Service.
#  - Reparto entre zonas y nodos con topologySpreadConstraints.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: reposteria-app
  labels:
    app.kubernetes.io/name: reposteria
    app.kubernetes.io/component: web
  annotations:
    # Opcional, con Stakater Reloader: reinicia los pods cuando ESO rota el secreto.
    secret.reloader.stakater.com/reload: "reposteria-app-secrets"
spec:
  # 3 réplicas como mínimo garantizadas por el HPA (minReplicas: 3, hpa.yaml).
  # "replicas" se omite a propósito (recomendación de Kubernetes con HPA): si estuviera
  # aquí, cada "kubectl apply"/sincronización de GitOps podría devolver el Deployment a
  # 3 pods en mitad de un pico. Si NO usas el HPA, descomenta la línea siguiente.
  # replicas: 3
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 25%
  selector:
    matchLabels:
      app.kubernetes.io/name: reposteria
      app.kubernetes.io/component: web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: reposteria
        app.kubernetes.io/component: web
    spec:
      serviceAccountName: reposteria-app
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        # UID/GID del usuario "nextjs" de la imagen (ajustar al Dockerfile real).
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        # Repartir entre zonas de disponibilidad si las hay (si el clúster es de una
        # sola zona, ScheduleAnyway evita dejar pods pendientes).
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: reposteria
              app.kubernetes.io/component: web
          matchLabelKeys:
            - pod-template-hash
        # Repartir entre nodos de forma estricta (una caída de nodo no tumba la mayoría).
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: reposteria
              app.kubernetes.io/component: web
          matchLabelKeys:
            - pod-template-hash
      containers:
        - name: app
          # Fijar por digest en producción (kustomization.yaml -> images).
          image: ghcr.io/example/reposteria:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          envFrom:
            - configMapRef:
                name: reposteria-config
            - secretRef:
                name: reposteria-app-secrets
          securityContext:
            allowPrivilegeEscalation: false
            privileged: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests:
              cpu: 250m
              memory: 384Mi
            limits:
              # Límite de CPU generoso para evitar throttling en picos de SSR;
              # quítalo si tu política de clúster lo permite.
              cpu: "1"
              memory: 768Mi
          startupProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 2
            timeoutSeconds: 2
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 4
          readinessProbe:
            httpGet:
              path: /api/health/ready
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
            successThreshold: 1
          lifecycle:
            # Da tiempo a que el Service/ingress dejen de enviar tráfico antes del SIGTERM.
            # Acción "sleep" nativa (Kubernetes >= 1.30): no requiere shell en la imagen.
            preStop:
              sleep:
                seconds: 5
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: next-cache
              mountPath: /app/.next/cache
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 256Mi
        # Caché de optimización de imágenes/ISR de Next.js (por pod, no compartida).
        - name: next-cache
          emptyDir:
            sizeLimit: 1Gi
