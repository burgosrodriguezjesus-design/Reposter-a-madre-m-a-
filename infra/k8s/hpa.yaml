# Autoescalado horizontal: 3-20 réplicas por CPU (65 %) y memoria (75 %).
# Requiere metrics-server. PLANTILLA NO PROBADA EN UN CLÚSTER.
#
# Nota: Node.js no siempre devuelve memoria al sistema, así que la métrica de
# memoria sirve para escalar hacia arriba en picos; el escalado hacia abajo es
# lento a propósito (ventana de 5 min y como mucho 10 % de pods por minuto).
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: reposteria-app
  labels:
    app.kubernetes.io/name: reposteria
    app.kubernetes.io/component: web
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: reposteria-app
  minReplicas: 3
  maxReplicas: 20
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 65
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 75
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 0
      selectPolicy: Max
      policies:
        - type: Percent
          value: 100
          periodSeconds: 30
        - type: Pods
          value: 4
          periodSeconds: 30
    scaleDown:
      stabilizationWindowSeconds: 300
      selectPolicy: Min
      policies:
        - type: Percent
          value: 10
          periodSeconds: 60
