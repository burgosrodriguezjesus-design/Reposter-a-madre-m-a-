# ════════════════════════════════════════════════════════════════════
#  Redis 7 — configuración endurecida (límites de peticiones y bloqueos compartidos)
# ════════════════════════════════════════════════════════════════════
#  Montaje: /usr/local/etc/redis/redis.conf (solo lectura). Arranque: infra/redis/entrypoint.sh,
#  que genera el archivo de usuarios ACL (aclfile) desde los secretos de Docker y ejecuta
#  "redis-server /usr/local/etc/redis/redis.conf".
#
#  Uso por la app (src/lib/limiter.ts, src/lib/redis.ts): contadores con INCR/INCRBY/PEXPIRE/GET
#  dentro de MULTI, PING e INFO (comprobación de disponibilidad de ioredis). Son datos efímeros:
#  si Redis se reinicia vacío, los límites empiezan de cero y la app degrada a límites en memoria.
#  Por eso NO hay persistencia en disco (sin RDB ni AOF) y la política de memoria es allkeys-lru.
# ════════════════════════════════════════════════════════════════════

# ── Red ──
# Escucha en todas las interfaces DEL CONTENEDOR, que solo está en la red interna "data"
# (internal: true) y no publica puertos. protected-mode sigue activo como red de seguridad.
bind 0.0.0.0
port 6379
protected-mode yes
tcp-backlog 511
timeout 300
tcp-keepalive 60
maxclients 1000

# ── Autenticación y autorización ──
# Equivalente a "requirepass" pero con permisos mínimos por usuario: la contraseña del usuario
# "default" (la que usa la app en REDIS_URL=redis://:<password>@redis:6379/0) se guarda como hash
# SHA-256 en el aclfile que genera entrypoint.sh en un tmpfs. Ver ese script para los permisos:
#   default   (app)        +@all -@dangerous -@scripting -@pubsub -@blocking +info, solo db 0
#   exporter  (métricas)   solo INFO, PING, CONFIG GET, SLOWLOG, LATENCY, CLIENT LIST...
# No uses "requirepass" aquí: con aclfile, la contraseña la define el ACL.
aclfile /data/users.acl
acllog-max-len 128

# ── Comandos peligrosos desactivados por completo ──
# Además de quitarlos por ACL, se eliminan del servidor (nadie, ni con una contraseña filtrada,
# puede vaciar datos, cambiar la configuración en caliente, cargar módulos ni ejecutar Lua).
# Lua desactivado: la app no lo usa y ha tenido fallos graves (p. ej. CVE-2025-49844).
# Nota: "rename-command" está desaconsejado en Redis 7 frente a ACL, pero sigue funcionando y
# aquí se usa solo para ELIMINAR comandos (no para renombrarlos).
# CONFIG no se elimina (lo necesita "CONFIG GET" del exportador de métricas): la ACL lo
# impide al usuario de la app y solo permite CONFIG GET al exportador.
rename-command FLUSHALL ""
rename-command FLUSHDB ""
rename-command DEBUG ""
rename-command KEYS ""
rename-command MODULE ""
rename-command MONITOR ""
rename-command SAVE ""
rename-command BGSAVE ""
rename-command BGREWRITEAOF ""
rename-command REPLICAOF ""
rename-command SLAVEOF ""
rename-command SYNC ""
rename-command PSYNC ""
rename-command MIGRATE ""
rename-command RESTORE ""
rename-command FAILOVER ""
rename-command SHUTDOWN ""
rename-command EVAL ""
rename-command EVALSHA ""
rename-command EVAL_RO ""
rename-command EVALSHA_RO ""
rename-command SCRIPT ""
rename-command FUNCTION ""
rename-command FCALL ""
rename-command FCALL_RO ""
enable-protected-configs no
enable-debug-command no
enable-module-command no

# ── Memoria ──
# Solo contadores pequeños: 256 MB sobran. Al llenarse se expulsan las claves menos usadas
# (allkeys-lru) en vez de rechazar escrituras (noeviction rompería los límites de la app).
maxmemory 256mb
maxmemory-policy allkeys-lru
maxmemory-samples 5
lazyfree-lazy-eviction yes
lazyfree-lazy-expire yes

# ── Persistencia: desactivada (datos efímeros) ──
save ""
appendonly no
dir /data

# ── Registro ──
loglevel notice
logfile ""
syslog-enabled no
# Consultas lentas (>10 ms) para diagnóstico con SLOWLOG GET (sin argumentos de más de 128 bytes)
slowlog-log-slower-than 10000
slowlog-max-len 128
latency-monitor-threshold 100

# ── Varios ──
databases 1
always-show-logo no
set-proc-title yes
