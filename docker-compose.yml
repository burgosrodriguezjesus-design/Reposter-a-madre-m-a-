# Base de datos PostgreSQL para desarrollo local: `docker compose up -d`
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: reposteria
      POSTGRES_PASSWORD: reposteria
      POSTGRES_DB: reposteria
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
volumes:
  pgdata:
