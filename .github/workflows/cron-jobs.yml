# ════════════════════════════════════════════════════════════════════
#  Cola de trabajos cada 5 minutos para despliegues en Vercel con plan Hobby.
#
#  Hobby solo permite crons diarios (vercel.json): sin esto, un email o aviso que falle tras el
#  primer intento (kickJobs) y la conciliación de pagos de Stripe esperarían hasta el día
#  siguiente. Con Vercel Pro, cambia en vercel.json la de /api/cron/jobs a "* * * * *" y
#  desactiva este workflow (variable de repositorio CRON_VIA_GITHUB=false).
#  Autoalojado (docker-compose/k8s) no lo necesita: infra/scheduler y los CronJobs lo hacen.
#
#  Configuración: Settings → Environments → "cron" (SIN revisores obligatorios, solo rama main):
#    secreto CRON_SECRET (el mismo valor que en Vercel) · variable PRODUCTION_URL (https://...)
#  Si falta algo, el job termina sin hacer nada. GitHub puede retrasar los schedule unos minutos.
# ════════════════════════════════════════════════════════════════════
name: Cron jobs

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cron-jobs
  cancel-in-progress: false

jobs:
  run:
    if: vars.CRON_VIA_GITHUB != 'false'
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    environment: cron
    steps:
      - name: Llamar a /api/cron/jobs
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          PRODUCTION_URL: ${{ vars.PRODUCTION_URL }}
        run: |
          set -euo pipefail
          if [ -z "${CRON_SECRET:-}" ] || [ -z "${PRODUCTION_URL:-}" ]; then
            echo "::notice::Entorno 'cron' sin CRON_SECRET o PRODUCTION_URL: no se hace nada"
            exit 0
          fi
          case "$PRODUCTION_URL" in https://*) ;; *) echo "::error::PRODUCTION_URL debe ser https"; exit 1 ;; esac
          # El secreto va en una cabecera leída de un archivo temporal (no aparece en la línea de órdenes)
          hdr="$(mktemp)"; trap 'rm -f "$hdr"' EXIT
          printf 'Authorization: Bearer %s\n' "$CRON_SECRET" > "$hdr"
          code="$(curl -sS -o /dev/null -w '%{http_code}' -m 90 -H @"$hdr" "${PRODUCTION_URL%/}/api/cron/jobs")"
          echo "HTTP $code"
          [ "$code" = "200" ] || { echo "::error::/api/cron/jobs respondió $code"; exit 1; }
