# ════════════════════════════════════════════════════════════════════
#  Reglas Semgrep propias del proyecto (se suman a los conjuntos del registro
#  en .github/workflows/security.yml).
#
#  Severidades:
#    ERROR   → rompe el CI (fallo de seguridad casi seguro).
#    WARNING → se informa en GitHub code scanning y en la revisión, no rompe el CI.
#
#  Probar en local:
#    python3 -m venv /tmp/semgrep && /tmp/semgrep/bin/pip install semgrep
#    /tmp/semgrep/bin/semgrep scan --metrics=off --config .semgrep/ src/
#    /tmp/semgrep/bin/semgrep --test --config .semgrep/rules.yml .semgrep/rules.ts
#    /tmp/semgrep/bin/semgrep --test --config .semgrep/rules.yml .semgrep/rules.tsx
#  (rules.ts / rules.tsx son casos de prueba con anotaciones "ruleid:" / "ok:"; el CI los
#  excluye del escaneo con --exclude .semgrep)
#
#  Silenciar un falso positivo concreto (con justificación en la revisión):
#    // nosemgrep: reposteria.<id-de-regla> -- motivo
# ════════════════════════════════════════════════════════════════════
rules:
  # ───────────────────────── SQL sin parametrizar ─────────────────────────
  - id: reposteria.prisma-raw-unsafe
    languages: [typescript, javascript]
    severity: ERROR
    message: >-
      $queryRawUnsafe / $executeRawUnsafe con contenido dinámico permite inyección SQL.
      Usa la plantilla etiquetada $queryRaw`... ${valor}` (parámetros enlazados) o Prisma.sql.
      Solo se admite una cadena literal fija, sin interpolaciones.
    metadata:
      category: security
      cwe: "CWE-89: Improper Neutralization of Special Elements used in an SQL Command"
      owasp: "A03:2021 - Injection"
      asvs: "V5.3.4"
    paths:
      exclude:
        # Comprobador de privilegios de la BD: ejecuta a propósito DDL/DML de sondeo cuyos textos
        # son constantes definidas en el mismo archivo (nunca datos de usuario) dentro de una
        # transacción que siempre se deshace. Revisar si cambia la firma de denied().
        - "/scripts/check-db-security.ts"
    patterns:
      - pattern-either:
          - pattern: $DB.$queryRawUnsafe($SQL, ...)
          - pattern: $DB.$executeRawUnsafe($SQL, ...)
      # Una cadena literal constante ("...", '...' o `...` sin ${}) no es inyectable
      - pattern-not: $DB.$queryRawUnsafe("...")
      - pattern-not: $DB.$executeRawUnsafe("...")
      - pattern-not-regex: \$(?:query|execute)RawUnsafe\(\s*`[^`$]*`\s*\)

  # ───────────────────────── XSS por HTML crudo ─────────────────────────
  - id: reposteria.dangerously-set-inner-html
    languages: [typescript, javascript]
    severity: ERROR
    message: >-
      dangerouslySetInnerHTML solo está permitido en src/components/site/JsonLd.tsx (JSON-LD
      escapado). En cualquier otro sitio renderiza texto con JSX (React lo escapa) o sanea el HTML.
    metadata:
      category: security
      cwe: "CWE-79: Improper Neutralization of Input During Web Page Generation"
      owasp: "A03:2021 - Injection"
      asvs: "V5.3.3"
    paths:
      exclude:
        - "/src/components/site/JsonLd.tsx"
    pattern-either:
      - pattern: <$EL dangerouslySetInnerHTML={$X} />
      - pattern: "{dangerouslySetInnerHTML: $X}"
      - pattern: "React.createElement($EL, {dangerouslySetInnerHTML: $X}, ...)"
      - pattern: $EL.innerHTML = $X
      - pattern: $EL.outerHTML = $X
      - pattern: $EL.insertAdjacentHTML(...)

  # ─────────────── Server Actions del panel sin control de acceso ───────────────
  - id: reposteria.admin-server-action-without-authz
    languages: [typescript]
    severity: ERROR
    message: >-
      Server Action exportada en el panel (src/app/admin/**) sin requirePermission(...) ni
      requireAdmin(). Cada acción es un endpoint POST público: comprueba la sesión y el permiso
      dentro de la propia función (ASVS V4.1.1, V4.2.1), aunque la página ya lo haga.
    metadata:
      category: security
      cwe: "CWE-862: Missing Authorization"
      owasp: "A01:2021 - Broken Access Control"
      asvs: "V4.1.1"
    paths:
      include:
        - "/src/app/admin/**"
      exclude:
        # El inicio de sesión es, por definición, anterior a la autenticación
        - "/src/app/admin/login/**"
    patterns:
      - pattern-inside: |
          "use server";
          ...
      - pattern-either:
          - pattern: |
              export async function $F(...) { ... }
          - pattern: |
              export const $F = async (...) => { ... };
      - pattern-not: |
          export async function $F(...) { ... requirePermission(...); ... }
      - pattern-not: |
          export async function $F(...) { ... requireAdmin(); ... }
      - pattern-not: |
          export async function $F(...) { ... $V = await requirePermission(...); ... }
      - pattern-not: |
          export async function $F(...) { ... $V = await requireAdmin(); ... }
      - pattern-not: |
          export async function $F(...) { ... const $V = await requirePermission(...); ... }
      - pattern-not: |
          export async function $F(...) { ... const $V = await requireAdmin(); ... }
      - pattern-not: |
          export async function $F(...) { ... const {...} = await requirePermission(...); ... }
      - pattern-not: |
          export async function $F(...) { ... const {...} = await requireAdmin(); ... }
      - pattern-not: |
          export const $F = async (...) => { ... requirePermission(...); ... };
      - pattern-not: |
          export const $F = async (...) => { ... const $V = await requirePermission(...); ... };

  # ───────────────────── Datos personales en los registros ─────────────────────
  - id: reposteria.console-log-personal-data
    languages: [typescript, javascript]
    severity: WARNING
    message: >-
      console.$M con una variable que parece un email o teléfono. Los registros no deben contener
      datos personales (RGPD art. 5.1.c y 32; ASVS V7.1.1): usa log.* de src/lib/logger.ts, que
      enmascara, o registra solo identificadores internos.
    metadata:
      category: security
      cwe: "CWE-532: Insertion of Sensitive Information into Log File"
      owasp: "A09:2021 - Security Logging and Monitoring Failures"
      asvs: "V7.1.1"
    paths:
      exclude:
        - "**/*.test.ts"
        - "**/*.spec.ts"
        - "/tests/**"
    patterns:
      - pattern-either:
          # Identificadores, accesos a propiedades u objetos {email} como argumento.
          # Las cadenas literales ("Email enviado") no cuentan.
          - patterns:
              - pattern: console.$M(..., $V, ...)
              - metavariable-regex:
                  metavariable: $V
                  regex: (?is)^(?:[\w$.?\[\]]*(?:e[-_]?mail|phone|tel[eé]fono|telefono|movil|m[oó]vil|mobile)\w*|\{.*\b(?:e[-_]?mail|phone|tel[eé]fono|telefono|mobile)\w*\b.*\})$
          # Plantillas: console.log(`enviado a ${cliente.email}`)
          - patterns:
              - pattern: console.$M(..., `...${$W}...`, ...)
              - metavariable-regex:
                  metavariable: $W
                  regex: (?is)^(?:[\w$.?\[\]]*(?:e[-_]?mail|phone|tel[eé]fono|telefono|movil|m[oó]vil|mobile)\w*|\{.*\b(?:e[-_]?mail|phone|tel[eé]fono|telefono|mobile)\w*\b.*\})$
      - metavariable-regex:
          metavariable: $M
          regex: ^(log|info|warn|error|debug|trace|dir|table)$

  # ───────────────────── Aleatoriedad no criptográfica ─────────────────────
  - id: reposteria.math-random-for-secrets
    languages: [typescript, javascript]
    severity: ERROR
    message: >-
      Math.random() no es criptográficamente seguro y es predecible. Para tokens, códigos,
      contraseñas, nonces o identificadores de sesión usa crypto.randomBytes / crypto.randomUUID
      (node:crypto) o crypto.getRandomValues (navegador). ASVS V6.3.1.
    metadata:
      category: security
      cwe: "CWE-338: Use of Cryptographically Weak Pseudo-Random Number Generator (PRNG)"
      owasp: "A02:2021 - Cryptographic Failures"
      asvs: "V6.3.1"
    paths:
      exclude:
        - "**/*.test.ts"
        - "/tests/**"
    patterns:
      - pattern: Math.random()
      - pattern-either:
          - pattern-inside: $NAME = $E
          - pattern-inside: const $NAME = $E;
          - pattern-inside: let $NAME = $E;
          - pattern-inside: |
              {..., $NAME: $E, ...}
          - pattern-inside: |
              function $NAME(...) { ... }
          - pattern-inside: |
              const $NAME = (...) => $E;
          - pattern-inside: |
              $OBJ.$NAME = $E
      - metavariable-regex:
          metavariable: $NAME
          # "key" a secas se excluye: es la prop key de las listas de React, no un secreto
          regex: (?i)^(?!key$).*(token|secret|nonce|passw|pwd|otp|salt|session|apikey|api_key|key|code|codigo|pin|voucher|coupon|cupon|giftcard|tarjeta|recovery|reset|csrf|signature|firma).*

  # ───────────────────── Cookies accesibles desde JavaScript ─────────────────────
  - id: reposteria.cookie-without-httponly
    languages: [typescript, javascript]
    severity: WARNING
    message: >-
      Cookie establecida sin httpOnly: true. Las cookies de sesión, acceso o CSRF deben ser
      HttpOnly + Secure + SameSite (ASVS V3.4.1-V3.4.3). Si la cookie debe leerla el navegador
      (p. ej. preferencia de consentimiento sin datos sensibles), justifícalo con nosemgrep.
    metadata:
      category: security
      cwe: "CWE-1004: Sensitive Cookie Without 'HttpOnly' Flag"
      owasp: "A05:2021 - Security Misconfiguration"
      asvs: "V3.4.2"
    pattern-either:
      - patterns:
          - pattern-either:
              - pattern: $JAR.set($NAME, $VALUE, $OPTS)
              - pattern: $JAR.set($NAME, $VALUE)
              - pattern: $JAR.set({...})
          - metavariable-regex:
              metavariable: $JAR
              # cookies() de next/headers, res.cookies, jar, cookieStore...
              regex: (?i).*(cookie|jar).*
          - pattern-not: '$JAR.set($NAME, $VALUE, {..., httpOnly: true, ...})'
          - pattern-not: '$JAR.set({..., httpOnly: true, ...})'
          # Borrar una cookie (maxAge 0 / valor vacío) no expone nada
          - pattern-not: $JAR.set($NAME, "", ...)
          - pattern-not: '$JAR.set($NAME, $VALUE, {..., maxAge: 0, ...})'
      - pattern: '$JAR.set($NAME, $VALUE, {..., httpOnly: false, ...})'
      - pattern: document.cookie = $X

  # ───────────────────── SSRF: fetch con URL del usuario ─────────────────────
  - id: reposteria.fetch-url-from-user-input
    languages: [typescript, javascript]
    severity: WARNING
    message: >-
      fetch() con una URL construida a partir de datos de la petición (SSRF, CWE-918). Usa una
      URL base fija y una lista blanca de hosts, valida con new URL() y comprueba hostname y
      protocolo, y codifica los segmentos con encodeURIComponent. ASVS V12.6.1.
    metadata:
      category: security
      cwe: "CWE-918: Server-Side Request Forgery (SSRF)"
      owasp: "A10:2021 - Server-Side Request Forgery"
      asvs: "V12.6.1"
    mode: taint
    pattern-sources:
      - pattern: $REQ.nextUrl.searchParams.get(...)
      - pattern: $URL.searchParams.get(...)
      - pattern: (await $REQ.json())
      - pattern: (await $REQ.formData()).get(...)
      - pattern: (await $REQ.text())
      - pattern: $FORMDATA.get(...)
      - pattern: $REQ.headers.get(...)
      - pattern: (await searchParams)
      - pattern: (await params)
    pattern-sanitizers:
      - pattern: encodeURIComponent(...)
      - pattern: $SCHEMA.parse(...)
      - pattern: $SCHEMA.safeParse(...)
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: fetch($URL, ...)
              - pattern: fetch($URL)
          - focus-metavariable: $URL
