# Balanceador de PRUEBAS DE CARGA (no es la configuración de producción: ver infra/nginx).
worker_processes 2;
worker_rlimit_nofile 65535;
pid /srv/lb/nginx.pid;
error_log /srv/lb/nginx-error.log warn;
events { worker_connections 16384; multi_accept on; }
http {
  access_log off;
  server_tokens off;
  keepalive_requests 10000;
  upstream app {
    least_conn;
    server 127.0.0.1:3001 max_fails=3 fail_timeout=10s;
    server 127.0.0.1:3002 max_fails=3 fail_timeout=10s;
    server 127.0.0.1:3003 max_fails=3 fail_timeout=10s;
    keepalive 256;
  }
  server {
    listen 8443 ssl http2;
    ssl_certificate /srv/lb/cert.pem;
    ssl_certificate_key /srv/lb/key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:20m;
    ssl_session_tickets off;
    client_max_body_size 12m;
    location / {
      proxy_pass http://app;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host:$server_port;
      proxy_set_header X-Forwarded-Proto https;
      # SOLO PRUEBAS DE CARGA: cada usuario virtual simula su propia IP para que el límite por IP
      # se aplique como con usuarios reales. En producción: proxy_set_header X-Real-IP $remote_addr;
      set $client_ip $remote_addr;
      if ($http_x_loadtest_ip ~ "^10\.[0-9]+\.[0-9]+\.[0-9]+$") { set $client_ip $http_x_loadtest_ip; }
      proxy_set_header X-Real-IP $client_ip;
      proxy_connect_timeout 5s;
      proxy_read_timeout 30s;
      proxy_next_upstream error timeout;
    }
  }
}
